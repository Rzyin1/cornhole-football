name: Multiplayer tracker update

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/format-and-clock.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply multiplayer tracker update
        run: python3 .github/scripts/update_quarters.py
      - name: Format tracker and rules
        run: npx --yes prettier@3.3.3 --write index.html rules.html
      - name: Commit changes
        run: |
          git config user.name github-actions-bot
          git config user.email github-actions-bot@users.noreply.github.com
          git add index.html rules.html
          if ! git diff --cached --quiet; then
            git commit -m "Add teams player roles and individual stats"
            git push
          fi
