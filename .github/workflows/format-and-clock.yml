name: Format tracker and update clock

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/format-and-clock.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Update tracker rules
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()

          # Display/default game state: 20-minute quarters, 4 TO per half.
          s=s.replace('id="clock">15:00</div>', 'id="clock">20:00</div>')
          s=s.replace("q:1,sec:900,run:false,to:[3,3],ot:false", "q:1,sec:1200,run:false,to:[4,4],ot:false,clockHoldRound:false")

          # Existing saved games get the new timeout/clock-hold field safely.
          marker="if(!S.stats)S.stats=blankStats();"
          compat="if(S.clockHoldRound==null)S.clockHoldRound=false;if(!Array.isArray(S.to))S.to=S.ot?[3,3]:[4,4];"
          if compat not in s:
              s=s.replace(marker, compat+marker)

          # Timeout dots: 4 regulation, 3 OT.
          s=s.replace("(S.ot?2:3)-S.to[0]", "(S.ot?3:4)-S.to[0]")
          s=s.replace("(S.ot?2:3)-S.to[1]", "(S.ot?3:4)-S.to[1]")

          # A normal submitted down must NOT stop the continuous clock.
          s=s.replace("function submitRound(){if(S.kick){alert('Complete the kickoff and return first.');return}snap();stop();", "function submitRound(){if(S.kick){alert('Complete the kickoff and return first.');return}snap();")
          # If a timeout protected this round, resume automatically after it is scored.
          s=s.replace("apply(y);resetBags();render()}", "apply(y);resetBags();if(S.clockHoldRound&&!S.kick&&S.sec>0){S.clockHoldRound=false;startClock()}render()}")

          # Kickoffs always stop the clock, regardless of why the kickoff occurs.
          s=s.replace("function airmail(m){mode=m;", "function airmail(m){if(m==='kickoff')stop();mode=m;")

          # End of kickoff return starts the continuous clock for the new possession.
          s=s.replace("S.log.push('<b>RETURN ENDS:</b> '+kickReturnCount+' made before miss = '+(kickReturnCount*10)+' return yards. Ball at '+spotText());closeM('pick');render()}", "S.log.push('<b>RETURN ENDS:</b> '+kickReturnCount+' made before miss = '+(kickReturnCount*10)+' return yards. Ball at '+spotText());closeM('pick');if(S.sec>0)startClock();render()}")

          # Timeout stops now and protects the entire following normal round.
          s=s.replace("S.to[t]--;S.log.push('<b>TIMEOUT</b>", "S.to[t]--;S.clockHoldRound=true;S.log.push('<b>TIMEOUT</b>")

          # Add a reusable start function; manual button still works.
          old="function clockToggle(){S.run=!S.run;if(S.run){clearInterval(timer);timer=setInterval(()=>{if(S.sec>0){S.sec--;render()}else stop()},1000)}else stop();render()}"
          new="function startClock(){if(S.sec<=0)return;S.run=true;clearInterval(timer);timer=setInterval(()=>{if(S.sec>0){S.sec--;render()}else{stop();render()}},1000)}function clockToggle(){if(S.run)stop();else startClock();render()}"
          s=s.replace(old,new)

          # Quarter/halftime/overtime clock and timeout resets.
          s=s.replace("S.q++;S.sec=900;if(S.q==3){S.to=[3,3];", "S.q++;S.sec=1200;S.clockHoldRound=false;if(S.q==3){S.to=[4,4];")
          s=s.replace("S.ot=true;S.to=[2,2];S.sec=900;", "S.ot=true;S.to=[3,3];S.sec=1200;S.clockHoldRound=false;")

          # Imported old exports should use current clock behavior safely.
          s=s.replace("S.run=false;S.hist=Array.isArray(S.hist)?S.hist:[];", "S.run=false;S.clockHoldRound=false;S.hist=Array.isArray(S.hist)?S.hist:[];")

          p.write_text(s)
          PY

      - name: Format index.html
        run: npx --yes prettier@3.3.3 --write index.html

      - name: Commit tracker update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "Format tracker and implement continuous 20-minute clock"
            git push
          fi
